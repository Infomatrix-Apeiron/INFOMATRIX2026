<div class="shell">

    <!-- HEADER (опційно) -->
    @if (showHeader) {
        <header class="shell__header">

            @if (showBackButton) {
                <button class="back-btn" type="button" (click)="back.emit()" aria-label="Back">
                    ←
                </button>
            }

            @if (showProgress) {
                <div class="progress">
                    @for (i of [].constructor(totalSteps); track $index) {
                        <span
                                class="progress__seg"
                                [class.progress__seg--active]="$index < progress"
                        ></span>
                    }
                </div>
            }

            @if (showCoins) {
                <div class="coins">
                    <span class="text-badge">{{ moneyService.currentMoney() }}</span>
                    <span class="coins__icon"></span>
                </div>
            }

        </header>
    }

    <!-- ОСНОВНИЙ КОНТЕНТ -->
    <main class="shell__main">
        <ng-content />
    </main>

    <!-- FOOTER (кнопка приклеєна до низу) -->
    <footer class="shell__footer">
        <ng-content select="[footer]" />
    </footer>

    <!-- BOTTOM NAV (опційно) -->
    @if (showBottomNav) {
        <nav class="bottom-nav">
            <button type="button" (click)="clearLocalStorage()">
                <img src="assets/icon_home.svg" alt="Logo" />
            </button>
            <button type="button" class="bottom-nav__active">
                <img src="assets/icon_game.svg" alt="Logo" />
            </button>
            <button type="button">
                <img src="assets/icon_heart.svg" alt="Logo" />
            </button>
            <button type="button">
                <img src="assets/icon_person.svg" alt="Logo" />
            </button>
        </nav>
    }

</div>
