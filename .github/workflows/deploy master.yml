name: Deploy FE "master"

on:
  push:
    branches: [master]

# environments
# "PRODUCTION" | "PRERELEASE" | "DEVELOP"

env:
  HOST_USER: "ubuntu"
  APP_DIR: "/home/ubuntu/fin-tracker/fe"
  ARTIFACTS_DIR: "/home/ubuntu/fin-tracker/artifacts"
  IMAGE_NAME: "fin-tracker-fe"
  CONTAINER_NAME: "fin-tracker-fe"

# secrets
# - REMOTE_HOST
# - SSH_KEY
# - SSH_PASSWORD
# - API_URL

jobs:
  prepare-server:
    environment: PRODUCTION
    runs-on: ubuntu-latest
    steps:
      - name: Create dirs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ env.HOST_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p ${{ env.APP_DIR }}
            mkdir -p ${{ env.ARTIFACTS_DIR }}

  build-and-upload-image:
    environment: PRODUCTION
    runs-on: ubuntu-latest
    needs: prepare-server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:latest .

      - name: Save and Compress Docker image
        run: docker save ${{ env.IMAGE_NAME }}:latest | gzip > ${{ env.IMAGE_NAME }}.tar.gz

      - name: Copy image to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ env.HOST_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "${{ env.IMAGE_NAME }}.tar.gz"
          target: ${{ env.ARTIFACTS_DIR }}

  copy-configs:
    environment: PRODUCTION
    runs-on: ubuntu-latest
    needs: build-and-upload-image
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy Docker Compose to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ env.HOST_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml" # Беремо файл з кореня твого проекту в GitHub
          target: ${{ env.APP_DIR }}

  deploy:
    environment: PRODUCTION
    runs-on: ubuntu-latest
    needs: copy-configs
    steps:
      - name: Load image and Restart Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ env.HOST_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker load < ${{ env.ARTIFACTS_DIR }}/${{ env.IMAGE_NAME }}.tar.gz
            cd ${{ env.APP_DIR }}
            docker compose up -d

  clear-after-deploy:
    environment: PRODUCTION
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Clear server after deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ env.HOST_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            rm ${{ env.ARTIFACTS_DIR }}/${{ env.IMAGE_NAME }}.tar.gz
            docker image prune -f
