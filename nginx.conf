server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Розмір тіла запиту (на випадок завантаження файлів через фронт)
    client_max_body_size 10M;

    # Gzip-стиснення для текстових ресурсів
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Базові security-заголовки
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Кешування статики (хеш у назві файлу робить це безпечним)
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html ніколи не кешуємо — інакше юзери зависають на старій версії
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    # Health check для моніторингу
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA fallback: усе невідоме віддаємо як index.html,
    # щоб Angular Router сам розрулив маршрут
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Сховати помилки за дефолтні сторінки nginx
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
